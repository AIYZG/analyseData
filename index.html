          const multiIndex = columnDatas.indexOf(multiKey);
          const singleIndex = columnDatas.indexOf(singleKey);
          if((multiKey && checkedValues.includes(String(e[multiIndex]))) || !multiKey) {
            multiFilter = true;
          }

          if((singleKey && e[singleIndex] == singleCheckValue) || !singleKey) {
            singleFilter = true;
          }
          
        } else {
          multiFilter = true;
          singleFilter = true;
        }
        if(Number(e[TempIndex]) >= Number(minTemp) && Number(e[TempIndex]) <= Number(maxTemp) && Number(e[vddIndex]) >= Number(minVoltage) && Number(e[vddIndex]) <= Number(maxVoltage) 
        && isItem && multiFilter && singleFilter) {
          chartData.push(e);
          const voltage = e[vddIndex]; // 电压
          if(!vddObject[voltage]) vddObject[voltage] = [];

          if(!allData[e[chipIndex]]) allData[e[chipIndex]] = {};
          if (!allData[e[chipIndex]][voltage] || allData[e[chipIndex]][voltage] < e[valueIndex]) allData[e[chipIndex]][voltage] = e[valueIndex];

          if(!voltList.includes(voltage)) {
            voltList.push(voltage);
          }

          vddObject[voltage].push(e[valueIndex]);
        }
      });

      voltList.sort((a, b) => a - b);
      if(minTemp == maxTemp) {
        createCharts(voltList, allData, '电压(V)', vddObject);
      }
      dataCompute(vddObject,'VDD(V)');
      // console.log(allData, "allData");
      // console.log(vddObject, "vddObject");
      // console.log(voltList, "voltList--");
    }
  }

  var myChart = echarts.init(document.getElementById('chart'));

  myChart.on('legendselectchanged', function(params) {
      const xAxisData = option.xAxis.data;
      const selected = params.selected;
      const objectData = {};
      option.series?.map(element => {
        if(selected[element.name]) {
          for(let i=0; i<xAxisData.length; i++) {
            if(!objectData[xAxisData[i]]) objectData[xAxisData[i]] = [];
            objectData[xAxisData[i]].push(element.data[i]);
          }
        }
      });

      const meanTable = document.getElementById('mean-table')
      const valueTable = document.getElementById('value-table')
      meanTable.innerHTML = `<tr><td id="vdd-td">VDD</td></tr>
                            <tr><td id="mean-td" class="value-title">mean</td></tr>
                            <tr><td id="singe-td">σ</td></tr>`
      valueTable.innerHTML = `<td class="value-title">MIN</td>
                              <td class="value-title">TYP</td>
                              <td class="value-title">MAX</td>`
      const min = document.getElementById('min-value')
      const typ = document.getElementById('typ-value')
      const max = document.getElementById('max-value')
      min.innerHTML = ''
      typ.innerHTML = ''
      max.innerHTML = ''
      dataCompute(objectData, option.xAxis.name == '温度(°C)' ? 'Temp(°C)' : 'VDD(V)');
    });


  myChart.on('click', function (params) {
    if (params.componentType === 'series') {
      var seriesName = params.seriesName;
      var legend = myChart.getOption().legend[0];
      var selected = legend.selected || {};
      selected[seriesName] = !selected[seriesName];
      myChart.dispatchAction({
        type: 'legendToggleSelect',
        name: seriesName
      });
    }
  });

  function createCharts(xAxis, data, xAxisName, objectData) {
    let allChartData = [];
    getChartData(xAxis, data, xAxisName);
    for(let key in objectData) {
      allChartData = [...allChartData, ...objectData[key]];
    }
    echartsDiv.style.display = 'block';
    
    myChart.clear();
    // option.legend.data = xAxis;
    option.xAxis.data = xAxis;
    option.xAxis.name = xAxisName;
    option.yAxis.name = valueNum[fileName][2];
    option.series = [];
    option.yAxis.max = Math.max(...allChartData);
    option.yAxis.min = Math.min(...allChartData);
    // option.yAxis.max = itemValue ? fileData[fileName][itemValue].max : fileData[fileName].max;
    // option.yAxis.min = itemValue ? fileData[fileName][itemValue].min : fileData[fileName].min;

    for(let key in data) {
      const dataList = [];
      option.legend.data.push(key);
      for(let i = 0; i < xAxis.length; i++) {
        dataList.push(data[key][xAxis[i]]);
      }
      option.series.push({
        name: key,
        type: 'line',
        data: dataList
      })
    }

    // 使用刚指定的配置项和数据显示图表
    myChart.setOption(option);
  }

  // 处理需要导出的图表数据
  function getChartData(xAxis, data, xAxisName) {
    excelData = [[xAxisName, ...Object.keys(data)]]
    xAxis.map(e => {
      // e为温度或电压
      const rowData = [e];
      Object.keys(data).forEach(el => {
        // el为chipId
        rowData.push(data[el][e]);
      });
      excelData.push(rowData);
    });
  }

  // 导出excel
  function exportExcel() {

    // 创建一个工作簿
    const workbook = XLSX.utils.book_new();

    // 创建一个工作表
    const worksheet = XLSX.utils.aoa_to_sheet(chartData);
    XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');

    if(excelData.length > 0) {
      const worksheet2 = XLSX.utils.aoa_to_sheet(excelData);
      XLSX.utils.book_append_sheet(workbook, worksheet2, 'Sheet2');
    }

    // XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet2');

    // var sheets = workbook.SheetNames;
    // sheets[0] = 'sheet名';
    // workbook.SheetNames = sheets;

    // 导出工作簿为Excel文件
    XLSX.writeFile(workbook, 'data.xlsx');
  }

  function multiUploadExcel() {
    try {
      // 选择多个文本文件并上传
      const fileSelector = document.createElement('input');
      fileSelector.setAttribute('type', 'file');
      fileSelector.setAttribute('multiple', 'multiple');
      fileSelector.setAttribute('webkitdirectory', 'webkitdirectory');
      fileSelector.setAttribute('directory', 'directory');
      fileSelector.addEventListener('change', handleFileSelect, false);
      fileSelector.click();

      // 处理文件选择事件
      function handleFileSelect(event) {
        const files = event.target.files;
        // 遍历选择的每个文件
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const fileName = getFileName(file);
          if(file.type === 'application/vnd.ms-excel' || file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
            const reader = new FileReader();
        
          reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            // 读取 Excel 文件内容
            const workbook = XLSX.read(data, { type: 'array' });
            analyseExcel(workbook, fileName);
          };
          
          reader.readAsArrayBuffer(file);
          }
        }

      }
    } catch (error) {
      // 处理错误的代码
      console.log("发生错误: " + error.message);
      alert('文件上传错误！')
    }
  }

  // 上传excel
  function uploadExcel() {
    try {
      // 上次文件前，先清空之前的残留数据
      clearSelect("min-voltage");
      clearSelect("max-voltage");
      clearSelect("min-temperature");
      clearSelect("max-temperature");
      clearSelect("item-select");
      minVoltage = maxVoltage = minTemp = maxTemp = itemValue = singleCheckValue = '';
      checkedValues = [];
      singleDatas = [];
      multiDatas = []; 
      //表格隐藏
      const tableData = document.getElementById('table-data')
      const echartsDiv = document.getElementById("chart");
      const itemSelect = document.getElementById('item')
      const multiSelect = document.getElementById('multi-select');
      const otherItem = document.getElementById('other-item');
      const singleSelect = document.getElementById('single-select');

      tableData.style.display = 'none';
      echartsDiv.style.display = 'none';
      itemSelect.style.display = 'none';
      multiSelect.style.display = 'none';
      multiSelect.innerHTML = `<span id="multi-title" class="item-span"></span>`
      otherItem.style.display = 'none';
      singleSelect.innerHTML = ''

      let inputElement = document.createElement("input");
      inputElement.setAttribute("type", "file");
      inputElement.setAttribute("id", "excelFile");
      inputElement.setAttribute("accept", ".xlsx, .xls");
      inputElement.addEventListener('change', handleFileSelect, false);
      inputElement.click();

      function handleFileSelect(event) {
        const file = inputElement.files[0];
        fileName = getFileName(file);
        if(!valueNum[fileName]){
          valueNum[fileName] = [5, 5, '']
        }
        const spanHtml = document.getElementById("file-name");
        if(itemIncludes.includes(fileName)) {
          itemSelect.style.display = 'flex';
        } else {
          itemSelect.style.display = 'none';
        }
        spanHtml.innerText = file.name;
        // 其他item的显示和渲染
        if(specialData[fileName]?.isMultiCheck) {
          multiSelect.style.display = 'flex';
          const multiTitle = document.getElementById('multi-title');
          multiTitle.innerText = specialData[fileName]?.isMultiCheck + `:`
        }
        if(specialData[fileName]?.isSingleCheck) {
          otherItem.style.display = 'flex';
          const singleTitle = document.getElementById('single-title');
          singleTitle.innerText = specialData[fileName]?.isSingleCheck + `:`
        }
        
        const reader = new FileReader();
        
        reader.onload = function(e) {
          const data = new Uint8Array(e.target.result);
          // 读取 Excel 文件内容
          const workbook = XLSX.read(data, { type: 'array' });
          
          analyseExcel(workbook, fileName);
        };
        
        reader.readAsArrayBuffer(file);
      }
    } catch (error) {
      // 处理错误的代码
      console.log("发生错误: " + error.message);
      alert('文件上传错误！')
    }
  }

  function analyseExcel(workbook, fileName) {
      vddDatas = [];
      tempDatas = [];
      itemDatas = [];
      originalData = [];
      columnDatas = [];
      multiSelect = [];
      singleSelect = [];

      // excel数据分析
      const worksheet = workbook.Sheets['data'];
      if(worksheet) {
        console.log(fileName, "fileName");
        // 将工作表转换为 JSON 格式的数据
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        originalData = jsonData;

        // jsonData是excel data页全部数据
        columnDatas = jsonData.shift();
        let tempIndex = columnDatas.indexOf('Temp');
        let vddIndex = columnDatas.indexOf('VDD');
        let itemIndex = columnDatas.indexOf('Item');
        let multiIndex = columnDatas.indexOf(specialData[fileName]?.isMultiCheck)
        let singleIndex = columnDatas.indexOf(specialData[fileName]?.isSingleCheck)
        jsonData.map(e => {
          if(!vddDatas.includes(e[vddIndex])) {
            vddDatas.push(e[vddIndex]);
          }
          if(!tempDatas.includes(e[tempIndex])) {
            tempDatas.push(e[tempIndex]);
          }
          if(!itemDatas.includes(e[itemIndex]) && itemIncludes.includes(fileName)) {
            itemDatas.push(e[itemIndex]);
          }
          if(!multiDatas.includes(e[multiIndex]) && specialData[fileName]?.isMultiCheck) {
            multiDatas.push(e[multiIndex]);
          }
          if(!singleDatas.includes(e[singleIndex]) && specialData[fileName]?.isSingleCheck) {
            singleDatas.push(e[singleIndex]);
          }
        });
        // 按升序排序
        vddDatas.sort((a, b) => a - b);
        tempDatas.sort((a, b) => a - b);
        setOption("min-voltage", vddDatas);
        setOption("max-voltage", vddDatas);
        setOption("min-temperature", tempDatas);
        setOption("max-temperature", tempDatas);
        setOption("item-select", itemDatas);
        let checkboxContainer = document.getElementById('multi-select');
        multiDatas.map((c, i) => {
          let checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.id = c;
          checkbox.name = 'checkbox';
          checkbox.value = c;
          checkbox.className = "checkbox-item";

          let label = document.createElement("label");
          label.htmlFor = c;
          label.appendChild(document.createTextNode(c));

          checkboxContainer.appendChild(checkbox);
          checkboxContainer.appendChild(label);
          })
          singleDatas && setOption("single-select", singleDatas);
      }
  }

  function getFileName(file) {
    // 获取文件名
    const fileName = file.name;
    const lastDotIndex = fileName.lastIndexOf('.');
    if (lastDotIndex === -1) {
      // 文件名中没有点号，返回原始文件名
      return fileName;
    } else {
      // 返回文件名中最后一个点号之前的部分
      return fileName.substring(0, lastDotIndex);
    }
  }

  function setOption(contentId, optionList) {
    let liItems = optionList.map((e) => `<option value="${e}">${e}</option>`).join('');
    const content = document.getElementById(contentId);
    liItems = '<option value="" disabled selected hidden></option>' + liItems;
    content.innerHTML = liItems;
  }

  function clearSelect(selectId) {
    // 清空下拉框选择
    const selectElement = document.getElementById(selectId);
    selectElement.selectedIndex = -1;
  }

  // 几何平均值
  function geometricMean(arr) {

    const hasZeroOrNegative = arr.some(num => num <= 0);
    if(hasZeroOrNegative) {
      // 算数平均值
      const sum = arr.reduce((total, num) => total + num, 0);
      const mean = sum / arr.length;
      return mean;
    }

    const filteredArr = arr.filter(num => num && !isNaN(num)); // 过滤掉空值或没有值的数据
    const logSum = filteredArr.reduce((sum, num) => sum + Math.log(num), 0);
    const mean = Math.exp(logSum / filteredArr.length);
    return mean;
  }

  // 标准偏差
  function standardDeviation(arr) {
    const numbers = arr.filter(num => num && !isNaN(num));
    const n = numbers.length;

    // 计算平均值
    const mean = numbers.reduce((a, b) => a + b, 0) / n;
    
    // 计算每个数值与平均值的差的平方和
    const sqDiff = numbers.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b, 0);
    
    // 计算样本标准差，注意是 n-1（贝塞尔校正）
    const stdDev = Math.sqrt(sqDiff / (n - 1));
    
    return stdDev;
  }

  function addNewTD(name, list){
    list.forEach(v => {
      const itemTd = document.getElementById(name);
      const itemTm = document.createElement('td')
      if(name === 'mean-td') {
        itemTm.textContent = v.toFixed(valueNum[fileName][0])
      }else if(name === 'singe-td') {
        itemTm.textContent = v.toFixed(valueNum[fileName][1])
      }else {
        itemTm.textContent = v
      }
      itemTm.setAttribute('id', 'newId'); 
      itemTd.insertAdjacentElement('afterend', itemTm);
    })
  }
   
  function dataCompute (data, flag) {
    console.log(data, "data");
    let meanValue = [];
    let deviationValue = [];
    let list = [];
    let singeMaSelect = document.getElementById('singeMa-select');
    let singeMa = singeMaSelect.value ? Number(singeMaSelect.value) : 6;
    let singeMaContent = document.getElementById('singeMa-value');
    singeMaContent.innerHTML = "σ系数：" + singeMa;
    const table = document.getElementById('table-data')
    const min = document.getElementById('min-value')
    const typ = document.getElementById('typ-value')
    const max = document.getElementById('max-value')
    const titleValue = document.querySelectorAll('.value-title')
  
    titleValue.forEach(t =>{
      if(valueNum[fileName][2]){
        t.textContent += `(${valueNum[fileName][2]})`
      }
    })
    table.style.display = 'flex'
    Object.values(data).forEach(value => {
      meanValue.push(geometricMean(value))
      deviationValue.push(standardDeviation(value))
  });
    list.push(...Object.keys(data))
    //平均值和方差绘制
    const item = document.getElementById('vdd-td');
    item.innerText = flag
    addNewTD('vdd-td', list)
    addNewTD('mean-td', meanValue)
    addNewTD('singe-td', deviationValue)
    //typ
    let sum = 0
    meanValue.forEach(v=>{ 
      sum += v
    })
    const typValue = sum / meanValue.length
    typ.innerText = (sum / meanValue.length).toFixed(valueNum[fileName][0])
    //min
    let minNumber = Math.min(...meanValue);
    const minValue = (minNumber - singeMa * Math.min(...deviationValue)).toFixed(valueNum[fileName][0])
    min.innerText = minValue
    //max
    let maxNumber = Math.max(...meanValue);
    let maxIndex = meanValue.indexOf(maxNumber);
    const maxValue = (maxNumber + singeMa * Math.max(...deviationValue)).toFixed(valueNum[fileName][0])
    max.innerText = maxValue
  }
